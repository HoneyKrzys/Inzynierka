{% if attachments %}
    <section class="card">
        <h3>Dokumenty z wcześniejszych badań</h3>
        <p class="muted small">
            Załączniki pacjenta. Pobierane wyłącznie przez lekarza prowadzącego; nie trafiają do AI.
        </p>
        {% for attachment in attachments %}
            <a class="list-row" href="{% url 'attachment_download' attachment.pk %}">
                <span>
                    {{ attachment.name }}
                    <small>{{ attachment.created|date:'d.m.Y H:i' }}</small>
                </span>
                <span>Pobierz ↓</span>
            </a>
        {% endfor %}
    </section>
{% endif %}
